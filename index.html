
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smooth Player</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #10111b;
      color: white;
      font-family: Arial, sans-serif;
    }
    .player {
      width: 100%;
      max-width: 430px;
      padding: 28px;
      border-radius: 24px;
      background: #202231;
      text-align: center;
      box-shadow: 0 15px 50px #0006;
    }
    .logo { font-size: 48px; }
    h1 { margin-bottom: 8px; }
    p { color: #b8bbd0; }
    input, button {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border: 0;
      border-radius: 12px;
      font-size: 15px;
    }
    input { background: #303348; color: white; }
    button {
      background: #8b7cff;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    audio, video { width: 100%; margin-top: 18px; }
    video { max-height: 260px; }
    #status { overflow-wrap: anywhere; font-size: 13px; }
  </style>
</head>
<body>
  <main class="player">
    <div class="logo">🎵</div>
    <h1>Smooth Player</h1>
    <p>Your music and video, in one place.</p>

    <label for="mediaFile">Choose a media file</label>
    <input id="mediaFile" type="file" accept="audio/*,video/*">

    <p>Or play media from a direct URL</p>
    <input id="mediaUrl" type="url" placeholder="Paste media URL">
    <button id="loadUrl">Play URL</button>

    <video id="video" controls hidden></video>
    <audio id="audio" controls hidden></audio>
    <p id="status">Ready to play</p>
  </main>

  <script>
    const fileInput = document.getElementById('mediaFile');
    const urlInput = document.getElementById('mediaUrl');
    const audio = document.getElementById('audio');
    const video = document.getElementById('video');
    const status = document.getElementById('status');
    let currentObjectUrl = null;

    function playMedia(src, isVideo, label) {
      audio.pause();
      video.pause();
      audio.hidden = true;
      video.hidden = true;

      const player = isVideo ? video : audio;
      player.src = src;
      player.hidden = false;
      status.textContent = label;
      player.play().catch(() => {
        status.textContent =
          'Ready. Press Play, or check that the media URL is valid.';
      });
    }

    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      if (!file) return;

      if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
      currentObjectUrl = URL.createObjectURL(file);
      playMedia(
        currentObjectUrl,
        file.type.startsWith('video/'),
        file.name
      );
    });

    document.getElementById('loadUrl').addEventListener('click', () => {
      const url = urlInput.value.trim();
      if (!url) {
        status.textContent = 'Please paste a media URL first.';
        return;
      }

      try {
        const parsed = new URL(url);
        if (!['http:', 'https:'].includes(parsed.protocol)) {
          throw new Error('Invalid protocol');
        }
        const isVideo = /\.(mp4|webm|ogv)(?:$|[?#])/i.test(parsed.href);
        playMedia(parsed.href, isVideo, 'Playing from URL');
      } catch {
        status.textContent = 'Please enter a valid HTTP or HTTPS URL.';
      }
    });
  </script>
</body>
</html>
